services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET é obrigatório}"
      USE_POSTGRES: "true"
      DATABASE_URL: "postgres://${POSTGRES_USER:-vruser}:${POSTGRES_PASSWORD:-vrpassword}@postgres:5432/${POSTGRES_DB:-vrgame}"
      HISTORY_LIMIT: "${HISTORY_LIMIT:-100}"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "coolify.managed=true"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vrgame}"
      POSTGRES_USER: "${POSTGRES_USER:-vruser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vrpassword}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vruser} -d ${POSTGRES_DB:-vrgame}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "coolify.managed=true"

volumes:
  postgres-data:
  app-data:
