services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    command: ["npm", "start"]
    working_dir: /app/backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AUTH_SECRET: ${AUTH_SECRET:-troque-por-uma-frase-grande-e-secreta}
      USE_POSTGRES: ${USE_POSTGRES:-true}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-vrgame}
      POSTGRES_USER: ${POSTGRES_USER:-vruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vrpassword}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-100}
      FRONTEND_DIR: ${FRONTEND_DIR:-/app/frontend}
      DB_PATH: ${DB_PATH:-/data/db.json}
      PUBLIC_URL: ${PUBLIC_URL:-}
      APP_URL: ${APP_URL:-}
      SERVICE_URL_APP: ${SERVICE_URL_APP:-}
      SERVICE_FQDN_APP: ${SERVICE_FQDN_APP:-}
      SERVICE_URL_APP_3000: ${SERVICE_URL_APP_3000:-}
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000:-}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vrgame}
      POSTGRES_USER: ${POSTGRES_USER:-vruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vrpassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  app-data:
