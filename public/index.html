<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Headbutt Berserker</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    .desktop-tip {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 10;
      max-width: 280px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
    }

    .custom-panel {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 11;
      width: min(340px, calc(100vw - 24px));
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 13px;
      line-height: 1.3;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(2px);
    }

    .custom-panel h2 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .custom-panel .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    .custom-panel label {
      font-size: 12px;
      color: #f0f0f0;
    }

    .custom-panel input[type="number"],
    .custom-panel select {
      width: 104px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 12px;
    }

    .custom-panel .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #cdcdcd;
    }

    .history-panel {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 11;
      width: min(420px, calc(100vw - 24px));
      max-height: min(46vh, 340px);
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(2px);
    }

    .history-panel h2 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .history-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.06);
    }

    .history-item-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 4px;
    }

    .history-item-meta {
      font-size: 11px;
      line-height: 1.35;
      color: #dedede;
      margin: 0;
    }

    .history-empty {
      font-size: 11px;
      color: #cdcdcd;
      margin: 0;
    }

    @media (max-width: 768px) {
      .desktop-tip {
        font-size: 12px;
        max-width: 220px;
      }

      .custom-panel {
        font-size: 12px;
      }

      .history-panel {
        max-height: min(38vh, 250px);
      }
    }
  </style>
</head>
<body>
  <div class="custom-panel" id="customModePanel">
    <h2>Modo alternativo</h2>

    <div class="row">
      <label for="customModeEnabled">Ativar modo customizado</label>
      <input id="customModeEnabled" type="checkbox" />
    </div>

    <div class="row">
      <label for="customLives">Vidas</label>
      <input id="customLives" type="number" min="1" step="1" value="3" />
    </div>

    <div class="row">
      <label for="customLivesInfinite">Vidas infinitas</label>
      <input id="customLivesInfinite" type="checkbox" />
    </div>

    <div class="row">
      <label for="customEnemyHits">Ataques para vencer</label>
      <input id="customEnemyHits" type="number" min="1" step="1" value="3" />
    </div>

    <div class="row">
      <label for="customEnemyHitsInfinite">Ataques infinitos</label>
      <input id="customEnemyHitsInfinite" type="checkbox" />
    </div>

    <div class="row">
      <label for="customDifficulty">Dificuldade (fase)</label>
      <select id="customDifficulty">
        <option value="1">Fase 1 (fácil)</option>
        <option value="2">Fase 2 (médio)</option>
        <option value="3">Fase 3 (difícil)</option>
      </select>
    </div>

    <div class="hint">As opções são aplicadas ao iniciar a partida.</div>
  </div>

  <div class="desktop-tip">
    Use o cursor central para mirar nos botões do painel.
    No desktop, as setas do teclado também funcionam.
  </div>

  <div class="history-panel" id="performanceHistoryPanel">
    <h2>Histórico de desempenho</h2>
    <p class="history-empty" id="historyEmptyText">Sem dados ainda. Finalize uma fase para gerar histórico.</p>
    <ul class="history-list" id="performanceHistoryList"></ul>
  </div>

  <a-scene
    renderer="antialias: true"
    xr-mode-ui="enabled: true"
    vr-mode-ui="enabled: true"
    background="color: #1a1a1a"
  >
    <a-assets>
      <audio
        id="battleSound"
        src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3">
      </audio>
    </a-assets>

    <a-entity
      environment="
        preset: forest;
        dressingAmount: 120;
        ground: hills;
        lighting: dusk;">
    </a-entity>

    <a-entity id="rig" position="0 0 0">
      <a-entity
        id="playerCamera"
        camera
        position="0 1.6 0"
        look-controls
        wasd-controls="acceleration: 18"
        head-input
      >
        <a-cursor
          id="gazeCursor"
          color="white"
          fuse="true"
          fuse-timeout="1200"
          raycaster="objects: .clickable">
        </a-cursor>

        <!-- HUD da esquerda acompanha a câmera -->
        <a-entity id="cameraHudRoot" position="-0.52 0.24 -1.1" scale="0.28 0.28 0.28">
          <a-plane
            width="2.15"
            height="2.55"
            color="#111111"
            opacity="0.84"
            material="shader: flat; depthTest: false"
            radius="0.08">
          </a-plane>

          <a-plane
            id="hudTitle"
            position="0 0.98 0.02"
            width="1.8"
            height="0.18"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Headbutt Berserker; align: left; fontSize: 70; color: #FFFFFF; padding: 28;">
          </a-plane>

          <a-plane
            id="hudPhase"
            position="0 0.72 0.02"
            width="1.8"
            height="0.15"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Fase: 1; align: left; fontSize: 58; color: #FFFFFF; padding: 24;">
          </a-plane>

          <a-plane
            id="hudLives"
            position="0 0.50 0.02"
            width="1.8"
            height="0.15"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Vidas: 3; align: left; fontSize: 58; color: #FFFFFF; padding: 24;">
          </a-plane>

          <a-plane
            id="hudEnemyHits"
            position="0 0.28 0.02"
            width="1.8"
            height="0.15"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Ataques no inimigo: 0/3; align: left; fontSize: 54; color: #FFFFFF; padding: 24;">
          </a-plane>

          <a-plane
            id="hudHits"
            position="0 0.06 0.02"
            width="1.8"
            height="0.15"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Acertos: 0; align: left; fontSize: 58; color: #FFFFFF; padding: 24;">
          </a-plane>

          <a-plane
            id="hudMisses"
            position="0 -0.16 0.02"
            width="1.8"
            height="0.15"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Erros: 0; align: left; fontSize: 58; color: #FFFFFF; padding: 24;">
          </a-plane>

          <a-plane
            id="hudAvgReaction"
            position="0 -0.38 0.02"
            width="1.8"
            height="0.15"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Tempo médio: --; align: left; fontSize: 52; color: #FFFFFF; padding: 24;">
          </a-plane>

          <a-plane
            id="hudPromptBg"
            position="0 -0.76 0.01"
            width="1.78"
            height="0.26"
            color="#252525"
            opacity="0.96"
            material="shader: flat; depthTest: false"
            radius="0.06">
          </a-plane>

          <a-plane
            id="hudPrompt"
            position="0 -0.76 0.02"
            width="1.68"
            height="0.18"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: APERTE INICIAR; align: center; fontSize: 72; color: #FFFFFF; padding: 10;">
          </a-plane>

          <a-plane
            id="hudResultBg"
            position="0 -1.08 0.01"
            width="1.78"
            height="0.34"
            color="#2B2B2B"
            opacity="0.95"
            material="shader: flat; depthTest: false"
            radius="0.06">
          </a-plane>

          <a-plane
            id="hudResult"
            position="0 -1.08 0.02"
            width="1.68"
            height="0.24"
            material="transparent: true; opacity: 0; shader: flat; depthTest: false"
            canvas-text="value: Aguardando...; align: center; fontSize: 50; color: #FFFFFF; padding: 18;">
          </a-plane>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Painel de botões continua no mundo -->
    <a-entity id="worldHud" position="0 1.9 -2.4">
      <a-entity id="vrControlsRoot" position="1.1 -0.05 0" scale="0.34 0.34 0.34">
        <a-plane
          width="2.7"
          height="3.2"
          color="#111111"
          opacity="0.84"
          radius="0.08">
        </a-plane>

        <a-plane
          position="0 1.22 0.02"
          width="2.1"
          height="0.18"
          material="transparent: true; opacity: 0"
          canvas-text="value: Headbutt Berserker; align: left; fontSize: 62; color: #FFFFFF; padding: 22;">
        </a-plane>

        <a-plane
          position="0 0.86 0.02"
          width="2.1"
          height="0.34"
          material="transparent: true; opacity: 0"
          canvas-text="value: Teclado: ↑ ataque, ← → esquiva, ↓ agachar, espaço pular; align: left; fontSize: 40; color: #FFFFFF; padding: 22;">
        </a-plane>

        <a-plane
          position="0 0.36 0.02"
          width="2.1"
          height="0.58"
          material="transparent: true; opacity: 0"
          canvas-text="value: Mire nos botões com o cursor central. Calibre a cabeça em posição neutra antes de jogar.; align: left; fontSize: 38; color: #D8D8D8; padding: 22;">
        </a-plane>

        <a-entity position="0 -0.40 0.02">
          <a-plane
            class="clickable"
            gaze-button="action: start; dwellTime: 1200"
            width="1.95"
            height="0.42"
            color="#2E8B57"
            radius="0.06">
          </a-plane>
          <a-plane
            position="0 0 0.01"
            width="1.7"
            height="0.18"
            material="transparent: true; opacity: 0"
            canvas-text="value: Iniciar Jogo; align: center; fontSize: 54; color: #FFFFFF; padding: 10;">
          </a-plane>
        </a-entity>

        <a-entity position="0 -1.00 0.02">
          <a-plane
            class="clickable"
            gaze-button="action: calibrate; dwellTime: 1200"
            width="1.95"
            height="0.42"
            color="#2C6CB0"
            radius="0.06">
          </a-plane>
          <a-plane
            position="0 0 0.01"
            width="1.7"
            height="0.18"
            material="transparent: true; opacity: 0"
            canvas-text="value: Calibrar Cabeça; align: center; fontSize: 50; color: #FFFFFF; padding: 10;">
          </a-plane>
        </a-entity>

        <a-entity position="0 -1.60 0.02">
          <a-plane
            class="clickable"
            gaze-button="action: reset; dwellTime: 1200"
            width="1.95"
            height="0.42"
            color="#8B2E2E"
            radius="0.06">
          </a-plane>
          <a-plane
            position="0 0 0.01"
            width="1.7"
            height="0.18"
            material="transparent: true; opacity: 0"
            canvas-text="value: Reiniciar; align: center; fontSize: 54; color: #FFFFFF; padding: 10;">
          </a-plane>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-entity id="enemy" position="0 0 -8" enemy-ai sound="src: #battleSound">
      <a-cylinder position="0 1 0" height="2" radius="0.5" color="#c68642"></a-cylinder>
      <a-sphere id="enemyHead" position="0 2.3 0" radius="0.5" color="#f1c27d"></a-sphere>
      <a-sphere position="0 2.5 0" radius="0.55" color="gray"></a-sphere>

      <a-cone position="-0.4 3.0 0" rotation="0 0 60" radius-bottom="0.1" height="0.8" color="white"></a-cone>
      <a-cone position="0.4 3.0 0" rotation="0 0 -60" radius-bottom="0.1" height="0.8" color="white"></a-cone>

      <a-entity id="leftArm" position="-0.8 1.4 0" rotation="0 0 30">
        <a-cylinder radius="0.15" height="1.2" color="#c68642"></a-cylinder>
        <a-cylinder position="-0.25 -0.6 0" radius="0.05" height="1.2" rotation="0 0 -30" color="#8B4513"></a-cylinder>
        <a-box position="-0.1 -1.2 0" depth="0.15" height="0.6" width="0.5" rotation="0 0 -30" color="silver"></a-box>
      </a-entity>

      <a-entity id="rightArm" position="0.8 1.4 0" rotation="0 0 -30">
        <a-cylinder radius="0.15" height="1.2" color="#c68642"></a-cylinder>
        <a-cylinder position="0.25 -0.6 0" radius="0.05" height="1.2" rotation="0 0 30" color="#8B4513"></a-cylinder>
        <a-box position="0.1 -1.2 0" depth="0.15" height="0.6" width="0.5" rotation="0 0 30" color="silver"></a-box>
      </a-entity>
    </a-entity>

    <a-entity arena-circle></a-entity>
    <a-plane rotation="-90 0 0" width="200" height="200" visible="false"></a-plane>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>
  </a-scene>

  <script src="script.js"></script>
</body>
</html>
